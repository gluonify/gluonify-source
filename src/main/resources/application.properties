# =====================================================================================================================================================================
# gluonify-source : configuration. Chaque ligne est expliquée ; toute valeur peut être remplacée par une variable d'environnement
# (quarkus.http.port -> QUARKUS_HTTP_PORT, source.store -> SOURCE_STORE). Gluonify configure vos applications par l'environnement, jamais par ce fichier.
# RÈGLE : aucune valeur sensible en clair ici (mot de passe, secret, jeton, clé : le builder de Gluonify refuse le dépôt, règle R-SECRET). Écrivez ${VARIABLE} ou ${app.clé}.
# =====================================================================================================================================================================

# --- HTTP : Gluonify fournit QUARKUS_HTTP_PORT et QUARKUS_HTTP_HOST=0.0.0.0 ; ces valeurs ne servent qu'en local. Jamais « localhost » ici (règle R-ECOUTE). ---
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# --- Stockage des notes : memory (défaut) | files (/distributed/std) | graph (Gdown). En production : SOURCE_STORE=files ou graph (voir README). ---
source.store=memory
source.files.dir=/distributed/std/notes
# Gdown : adresse fournie par la plateforme si l'application est déployée avec "uses": ["graphdb"] ; le compte et son mot de passe viennent du coffre (clés GRAPH_USER et GRAPH_PASSWORD).
source.graph.url=${SERVICE_GRAPHDB_URL:}
source.graph.database=source
source.graph.user=${app.graph.user:}
source.graph.password=${app.graph.password:}
# Récepteur de webhooks de Photon : fermé (404) tant que la clé n'est pas fournie (clé WEBHOOK_KEY du coffre -> variable APP_WEBHOOK_KEY)
source.webhook.key=${app.webhook.key:}

# --- Authentification : jetons de gluonify-charm (OpenID Connect, mode « service » = l'API vérifie un jeton porteur, elle n'en émet pas) ---
quarkus.oidc.application-type=service
# Charm : SERVICE_ID_URL est fournie si l'application est déployée avec "uses": ["id"]
quarkus.oidc.auth-server-url=${SERVICE_ID_URL:http://localhost:8180}/realms/gluonify
# L'émetteur (iss) des jetons de Charm est stable (https://id.<zone>/realms/gluonify) et n'est PAS l'adresse de l'instance qui sert la découverte : on le donne explicitement.
quarkus.oidc.token.issuer=${OIDC_ISSUER:any}
# Les jetons doivent être émis pour CETTE application (audience) : POST /v1/tokens de Charm avec "audience": "gluonify-source".
quarkus.oidc.token.audience=${OIDC_AUDIENCE:gluonify-source}
# Les rôles sont dans le claim « roles » du jeton (source:read, source:write)
quarkus.oidc.roles.role-claim-path=roles
# En développement et dans les tests : pas de serveur d'identité (voir DevAuthentication et @TestSecurity)
%dev.quarkus.oidc.enabled=false
%test.quarkus.oidc.enabled=false

# --- OpenAPI / Swagger UI : /q/openapi, /q/swagger-ui ---
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=gluonify-source
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=Application exemple pour Gluonify : notes, authentification Charm, stockage distribué ou Gdown, webhooks Photon.

# --- Interface web (Vue 3 dans src/main/webui), construite par Quinoa et servie à la racine ---
# Sans interface (build du service seul) : -Dquarkus.quinoa=false
quarkus.quinoa=true
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
# Les chemins que Quinoa NE doit PAS prendre pour des pages de l'interface (sinon une URL d'API non trouvée renverrait index.html)
quarkus.quinoa.ignored-path-prefixes=/api,/hooks,/q
# Node : téléchargé par Quinoa en local ; passer à false pour utiliser celui du système (c'est ce que fait Dockerfile.build)
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.3.0
quarkus.quinoa.dev-server.port=5173
# Les tests de l'interface (vitest) tournent avec « mvn test »
quarkus.quinoa.run-tests=true
# Le point d'entrée de l'interface est toujours revalidé (ses fichiers ont un nom à empreinte, donc immuables)
quarkus.http.filter.ui-entry.matches=^/(index\\.html)?$
quarkus.http.filter.ui-entry.header.Cache-Control=no-cache
quarkus.http.filter.ui-entry.order=100

# --- Santé et mesures : /q/health/ready (prêt), /q/health/live (vivant), /q/metrics (Prometheus) ---
%test.quarkus.http.test-port=0
# Les tests Java n'exigent pas Node : l'interface se teste à part (cd src/main/webui && npm test) et se construit au package.
%test.quarkus.quinoa=false
