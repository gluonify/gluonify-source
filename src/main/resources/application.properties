# =====================================================================================================================================================================
# gluonify-source : configuration. Every line is explained; any value can be overridden by an environment variable
# (quarkus.http.port -> QUARKUS_HTTP_PORT, source.store -> SOURCE_STORE). Gluonify configures your applications through the environment, never through this file.
# RULE: no sensitive value in clear text here (password, secret, token, key: the Gluonify builder rejects the repository, rule R-SECRET). Write ${VARIABLE} or ${app.key}.
# =====================================================================================================================================================================

# --- HTTP : Gluonify provides QUARKUS_HTTP_PORT and QUARKUS_HTTP_HOST=0.0.0.0; these values are only used locally. Never "localhost" here (rule R-ECOUTE). ---
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# --- Notes storage: auto (default) | memory | files (/distributed/std) | gdown (Gdown). auto = gdown when the platform provides a dedicated database
# (GLUONIFY_GDOWN_DATABASE, see below: the builder infers "gdownDatabase": true from these references), memory otherwise. Force with SOURCE_STORE (see README). ---
source.store=auto
source.files.dir=/distributed/std/notes
# Gdown: address provided by the platform if the application is deployed with "uses": ["gdown"]; the account and its password come from the vault (keys GLUONIFY_GDOWN_USER and GLUONIFY_GDOWN_PASSWORD).
# The APP_ prefix (${app.x} reads APP_X) exists ONLY in the <uuid>.app vault space obtained with "top": true in the app spec; with a literal topNamespace, keys arrive unprefixed.
source.graph.url=${GLUONIFY_SERVICE_GDOWN_URL:}
# GLUONIFY_GDOWN_DATABASE, GLUONIFY_GDOWN_USER and GLUONIFY_GDOWN_PASSWORD are provided by the platform for a dedicated database ("gdownDatabase": true); otherwise the vault keys (APP_GLUONIFY_GDOWN_*) apply
source.graph.database=${GLUONIFY_GDOWN_DATABASE:source}
source.graph.user=${app.gluonify.gdown.user:${GLUONIFY_GDOWN_USER:}}
source.graph.password=${app.gluonify.gdown.password:${GLUONIFY_GDOWN_PASSWORD:}}
# Photon webhook receiver: closed (404) until the key is provided (vault key WEBHOOK_KEY -> variable APP_WEBHOOK_KEY)
source.webhook.key=${app.webhook.key:}

# --- PDF documents (Crystallon): optional, and NOTHING to configure here. The Gluonify SDK (gluonify-plasma-quarkus) finds the address and the token by itself: on the platform when the application
# is deployed with "uses": ["crystallon"], on your machine after "gluonify login <zone>". Not available = feature off (404), nothing else changes.

# --- Authentication: gluonify-charm tokens (OpenID Connect, "service" mode = the API verifies a bearer token, it does not issue any) ---
quarkus.oidc.application-type=service
# Charm: GLUONIFY_SERVICE_CHARM_URL is provided if the application is deployed with "uses": ["charm"]
quarkus.oidc.auth-server-url=${GLUONIFY_SERVICE_CHARM_URL:http://localhost:8180}/realms/gluonify
# The issuer (iss) of Charm tokens is stable (https://id.<zone>/realms/gluonify) and is NOT the address of the instance serving discovery: we give it explicitly.
# On the platform ("uses": ["charm"]) it is injected as GLUONIFY_OIDC_ISSUER; GLUONIFY_SOURCE_OIDC_* override every platform value.
quarkus.oidc.token.issuer=${GLUONIFY_SOURCE_OIDC_ISSUER:${GLUONIFY_OIDC_ISSUER:any}}
# Tokens must be issued for THIS application (audience): Charm's POST /v1/tokens with "audience": "gluonify-source".
quarkus.oidc.token.audience=${GLUONIFY_SOURCE_OIDC_AUDIENCE:${GLUONIFY_OIDC_AUDIENCE:gluonify-source}}
# Roles are in the token's "roles" claim (source:read, source:write)
quarkus.oidc.roles.role-claim-path=roles
# Sign-in from the browser (the UI): a PUBLIC Charm client (authorization code + PKCE, no secret; the password is typed on Charm's page, never in this application).
# The UI reads these values from GET /api/auth-config. Client id: on the platform, the client app-<name> that Higgs creates in Charm for this application and injects as
# GLUONIFY_OIDC_CLIENT_ID (redirect = the addresses of the application, audience gluonify-<name> = GLUONIFY_OIDC_AUDIENCE): sign-in works with no configuration.
source.auth.client-id=${GLUONIFY_SOURCE_OIDC_CLIENT_ID:${GLUONIFY_OIDC_CLIENT_ID:}}
# Charm's PUBLIC address (what the browser reaches), injected by the platform as GLUONIFY_OIDC_PUBLIC_URL. Empty: derived from the issuer above (https://gluonify.lan/realms/gluonify -> https://gluonify.lan).
source.auth.charm-url=${GLUONIFY_SOURCE_CHARM_PUBLIC_URL:${GLUONIFY_OIDC_PUBLIC_URL:}}
# In development and in tests: no identity server (see DevAuthentication and @TestSecurity)
%dev.quarkus.oidc.enabled=false
%test.quarkus.oidc.enabled=false

# --- OpenAPI / Swagger UI : /q/openapi, /q/swagger-ui ---
quarkus.swagger-ui.always-include=true
# Swagger UI in production: read-only documentation (decided 2026-10-14). No "Try it out", every request other than loading the document is refused
# in the browser, and the "Authorize" and "Try it out" buttons are hidden: no pasted token can be used. Dev and test keep the full Swagger UI.
# Checked by SwaggerReadOnlyConfigTest.
%prod.quarkus.swagger-ui.try-it-out-enabled=false
%prod.quarkus.swagger-ui.persist-authorization=false
%prod.quarkus.swagger-ui.request-interceptor=function(req){if(req.loadSpec){return req;}throw new Error('Swagger UI is read-only in production');}
%prod.quarkus.swagger-ui.on-complete=function(){var s=document.createElement('style');s.textContent='.auth-wrapper,.authorization__btn,.try-out,.btn.execute{display:none !important}';document.head.appendChild(s);}
quarkus.smallrye-openapi.info-title=gluonify-source
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=Example application for Gluonify: notes, Charm authentication, distributed or Gdown storage, Photon webhooks, PDF documents (Crystallon).

# --- Web UI (Vue 3 in src/main/webui), built by Quinoa and served at the root ---
# Without the UI (service-only build) : -Dquarkus.quinoa=false
quarkus.quinoa=true
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
# Paths that Quinoa must NOT treat as UI pages (otherwise an API URL not found would return index.html)
quarkus.quinoa.ignored-path-prefixes=/api,/hooks,/q
# Node: downloaded locally by Quinoa; set to false to use the system one (what Dockerfile.build does)
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.3.0
quarkus.quinoa.dev-server.port=5173
# The UI tests (vitest) run with "mvn test"
quarkus.quinoa.run-tests=true
# The UI entry point is always revalidated (its files have hashed names, hence are immutable)
quarkus.http.filter.ui-entry.matches=^/(index\\.html)?$
quarkus.http.filter.ui-entry.header.Cache-Control=no-cache
quarkus.http.filter.ui-entry.order=100

# --- Health and metrics: /q/health/ready (ready), /q/health/live (alive), /q/metrics (Prometheus) ---
%test.quarkus.http.test-port=0
# Java tests do not require Node: the UI is tested separately (cd src/main/webui && npm test) and built at package time.
%test.quarkus.quinoa=false
